
name: Lab 5 Static Code Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Lab-5/**"
      - ".github/workflows/lab5-analysis.yml"

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit flake8

      - name: Generate before and after reports
        shell: bash
        run: |
          mkdir -p Lab-5/reports

          # Original baseline from first Lab 5 commit
          BASELINE=$(git log --reverse --format=%H -- Lab-5/scholarship_system.py | head -n 1)

          git show "$BASELINE:Lab-5/scholarship_system.py" > /tmp/scholarship_before.py
          cp Lab-5/scholarship_system.py /tmp/scholarship_after.py

          pylint /tmp/scholarship_before.py > Lab-5/reports/pylint_before.txt 2>&1 || true
          pylint /tmp/scholarship_after.py > Lab-5/reports/pylint_after.txt 2>&1 || true

          bandit /tmp/scholarship_before.py > Lab-5/reports/bandit_before.txt 2>&1 || true
          bandit /tmp/scholarship_after.py > Lab-5/reports/bandit_after.txt 2>&1 || true

          flake8 /tmp/scholarship_before.py > Lab-5/reports/flake8_before.txt 2>&1 || true
          flake8 /tmp/scholarship_after.py > Lab-5/reports/flake8_after.txt 2>&1 || true

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: lab5-static-analysis-reports
          path: Lab-5/reports/
          retention-days: 30
